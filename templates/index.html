<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Randomizatorh</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center;
           font: 1rem/1.6 system-ui, sans-serif; color:#e8eef6; background:#152033; }
    main { width:min(90vw,38rem); padding:2rem; border-radius:1.25rem;
           background:#21324b; box-shadow:0 1rem 3rem #0004; text-align:center; }
    .number { font-size:clamp(3rem,12vw,6rem); font-weight:750; margin:.5rem 0; }
    a { color:#8bd3ff; } footer { font-size:.85rem; margin-top:2rem; }
  </style>
</head>
<body>
<main>
  <h1>Randomizatorh</h1>
  <p>Python &amp; Flask random-number experiment</p>
  <p class="number" aria-label="Random number">{{ random_number }}</p>
  <p>Random integer between 1 and 1000</p>
  <p>Executions: <strong>{{ counter }}</strong></p>
  <p><a href="/">Generate another number</a></p>
  <p><a href="https://github.com/hamdyaea/Heroku_Randomizer">Source code</a></p>
  <footer>Developer: Hamdy Abou El Anein · hamdy.aea@protonmail.com</footer>
</main>
</body>
</html>
